name: Actualizar partidos

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas (hora UTC)
  workflow_dispatch:          # botón de la web (vía el Worker) o a mano desde GitHub
  push:                       # cuando cambias la web, los diales o el script
    branches: [main]
    paths: ["docs/index.html", "data/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar y cotejar fuentes
        run: python scripts/update.py

      - name: Guardar data.json en el repo
        run: |
          git config user.name "proyectopartidos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Reintentar el despliegue si GitHub falló
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
